<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쓸데없는 즉석복권</title>
<meta name="description" content="당첨 확률 40%! 당첨금은 0원인 쓸데없는 즉석복권">
<style>
  /* ===== 기본 색상 ===== */
  :root {
    --red: #e8202a;
    --red-dark: #a8101a;
    --yellow: #ffd400;
    --yellow-light: #fff3a8;
    --orange: #ff8a00;
    --ink: #3a1500;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--ink);
    background-color: #ffe14d;
    /* 복권방 느낌의 땡땡이 배경 */
    background-image:
      radial-gradient(circle at 25% 25%, rgba(255,255,255,.55) 0 6px, transparent 7px),
      radial-gradient(circle at 75% 75%, rgba(255,138,0,.25) 0 6px, transparent 7px);
    background-size: 44px 44px;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== 상단 카운터 ===== */
  .top {
    width: 100%;
    background: linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
    color: #fff;
    padding: 10px 16px 12px;
    box-shadow: 0 4px 0 #7a0a12, 0 8px 20px rgba(0,0,0,.2);
    position: relative;
  }
  .top h1 {
    text-align: center;
    font-size: clamp(18px, 5vw, 26px);
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--yellow);
    text-shadow: 2px 2px 0 #7a0a12;
    margin-bottom: 8px;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    max-width: 560px;
    margin: 0 auto;
  }
  .stat {
    background: rgba(0,0,0,.22);
    border: 2px solid rgba(255,212,0,.6);
    border-radius: 12px;
    padding: 6px 4px;
    text-align: center;
  }
  .stat .label { display: block; font-size: clamp(10px, 2.8vw, 13px); opacity: .9; }
  .stat .val {
    display: block;
    font-size: clamp(16px, 4.6vw, 22px);
    font-weight: 900;
    color: var(--yellow);
    font-variant-numeric: tabular-nums;
  }
  .stat .val.bump { animation: bump .5s ease; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.4); } 100% { transform: scale(1); } }

  .mute {
    position: absolute;
    top: 8px; right: 10px;
    background: rgba(0,0,0,.25);
    border: 0;
    border-radius: 50%;
    width: 34px; height: 34px;
    font-size: 17px;
    cursor: pointer;
  }

  /* ===== 메인 영역 ===== */
  main {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px 12px 24px;
    gap: 14px;
  }
  .hint {
    font-weight: 800;
    font-size: clamp(14px, 3.8vw, 17px);
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 6px 16px;
    box-shadow: 3px 3px 0 var(--ink);
    text-align: center;
    transition: background .3s, color .3s;
  }
  body.tense .hint { background: var(--ink); color: var(--yellow); animation: beatText .9s infinite; }
  @keyframes beatText { 0%,30%,100% { transform: scale(1); } 10% { transform: scale(1.08); } 20% { transform: scale(1.03); } }

  /* ===== 복권 카드 ===== */
  .ticket {
    width: min(94vw, 460px);
    border-radius: 20px;
    padding: 8px;
    background: repeating-linear-gradient(45deg, var(--yellow) 0 12px, var(--red) 12px 24px);
    box-shadow: 0 10px 0 rgba(122,10,18,.35), 0 18px 40px rgba(0,0,0,.25);
    position: relative;
    z-index: 41; /* 긴장 연출 때 어두운 배경보다 위 */
  }
  .ticket.enter { animation: ticketIn .55s cubic-bezier(.2,1.4,.4,1); }
  @keyframes ticketIn {
    0% { transform: translateY(40px) rotate(-6deg) scale(.85); opacity: 0; }
    100% { transform: none; opacity: 1; }
  }
  .ticket-inner {
    border-radius: 14px;
    border: 3px dashed rgba(255,255,255,.85);
    padding: 12px 12px 10px;
    /* 햇살 무늬 배경 */
    background:
      radial-gradient(circle at 50% 0%, rgba(255,243,168,.9) 0%, transparent 55%),
      repeating-conic-gradient(from 0deg at 50% 0%, #ff3b30 0deg 10deg, #ff5a3c 10deg 20deg);
    position: relative;
    overflow: hidden;
  }
  .ticket-head { text-align: center; color: #fff; margin-bottom: 10px; position: relative; }
  .badge {
    position: absolute;
    top: -2px; left: -2px;
    background: var(--yellow);
    color: var(--red-dark);
    font-weight: 900;
    font-size: 12px;
    padding: 4px 8px;
    border-radius: 8px;
    transform: rotate(-10deg);
    box-shadow: 2px 2px 0 var(--red-dark);
  }
  .ticket-head h2 {
    font-size: clamp(26px, 8vw, 38px);
    font-weight: 900;
    letter-spacing: -1px;
    color: var(--yellow);
    text-shadow:
      -2px -2px 0 var(--red-dark), 2px -2px 0 var(--red-dark),
      -2px 2px 0 var(--red-dark), 2px 2px 0 var(--red-dark),
      0 5px 0 #6b0710;
    line-height: 1.15;
  }
  .ticket-head .sub {
    font-size: clamp(13px, 3.6vw, 15px);
    font-weight: 700;
    margin-top: 4px;
    text-shadow: 1px 1px 0 var(--red-dark);
  }
  .ticket-head .sub b { color: var(--yellow); }
  .jackpot {
    display: inline-block;
    margin-top: 6px;
    background: #fff;
    color: var(--red);
    font-weight: 900;
    font-size: clamp(13px, 3.6vw, 15px);
    padding: 3px 12px;
    border-radius: 999px;
    border: 2px solid var(--yellow);
  }
  .jackpot strong { font-size: 1.2em; }

  /* ===== 긁는 칸 (3x2) ===== */
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    background: rgba(255,255,255,.25);
    padding: 10px;
    border-radius: 14px;
    border: 3px solid var(--yellow);
    touch-action: none; /* 긁는 동안 스크롤 방지 */
    cursor: crosshair;
  }
  .cell {
    position: relative;
    aspect-ratio: 1 / 1;
    background: radial-gradient(circle, #fffef2 0%, #fff3c4 100%);
    border-radius: 12px;
    border: 3px solid #fff;
    box-shadow: inset 0 0 0 2px rgba(255,138,0,.4);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    container-type: inline-size;
  }
  .cell .sym {
    font-size: 46px;
    font-size: 58cqw;
    line-height: 1;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,.15));
  }
  .cell.open .sym { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
  .cell canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transition: opacity .45s ease;
  }
  .cell canvas.gone { opacity: 0; pointer-events: none; }

  /* 마지막 칸 긴장 연출: 흔들림 + 빛 */
  .cell.tense {
    animation: shake .5s infinite, glow .9s infinite;
    z-index: 2;
    overflow: visible;
  }
  .cell.tense canvas { border-radius: 9px; }
  @keyframes shake {
    0%, 100% { transform: translate(0,0) rotate(0); }
    25% { transform: translate(-2px,1px) rotate(-1.5deg); }
    50% { transform: translate(2px,-1px) rotate(1deg); }
    75% { transform: translate(-1px,-1px) rotate(-.5deg); }
  }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 3px #fff59d, 0 0 14px 4px rgba(255,235,59,.7); }
    15% { box-shadow: 0 0 0 4px #fff, 0 0 30px 12px rgba(255,235,59,1); }
  }

  /* 결과 표시 */
  .cell.match { background: radial-gradient(circle, #fffbd0 0%, #ffd400 100%); animation: matchGlow 1s infinite alternate; }
  @keyframes matchGlow { from { box-shadow: 0 0 0 3px #fff, 0 0 10px 2px #fff59d; } to { box-shadow: 0 0 0 3px #fff, 0 0 26px 10px #fff59d; } }
  .cell.near { background: radial-gradient(circle, #fff 0%, #ffd9d9 100%); }
  .cell.dim .sym { opacity: .45; }

  .ticket-foot {
    display: flex;
    justify-content: space-between;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    margin-top: 8px;
    text-shadow: 1px 1px 0 var(--red-dark);
    font-variant-numeric: tabular-nums;
  }
  .fine {
    margin-top: 4px;
    font-size: 10.5px;
    color: rgba(255,255,255,.9);
    text-align: center;
  }

  /* ===== 버튼 ===== */
  .big-btn {
    font-family: inherit;
    font-size: clamp(18px, 5vw, 22px);
    font-weight: 900;
    color: #fff;
    background: linear-gradient(180deg, #ff4b4b, var(--red));
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 12px 32px;
    box-shadow: 0 6px 0 var(--ink);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
    position: relative;
    z-index: 41;
  }
  .big-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); }
  .big-btn.nudge { animation: nudge 1.2s infinite; }
  @keyframes nudge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  /* ===== 긴장 연출: 화면 주변 어둡게 ===== */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(25,0,0,.8) 100%);
    opacity: 0;
    transition: opacity .8s ease;
    z-index: 40;
  }
  body.tense .vignette { opacity: 1; animation: vigBeat .9s infinite; }
  @keyframes vigBeat { 0%, 100% { opacity: .8; } 10% { opacity: 1; } 22% { opacity: .85; } 32% { opacity: .95; } }

  /* ===== 폭죽 캔버스 ===== */
  #confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 60;
  }

  /* ===== 결과 팝업 ===== */
  .modal {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(60,10,0,.55);
  }
  .modal.show { display: flex; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-box {
    width: min(100%, 420px);
    background: #fffdf0;
    border: 4px solid var(--ink);
    border-radius: 22px;
    box-shadow: 0 8px 0 var(--ink);
    padding: 22px 18px 18px;
    text-align: center;
    animation: boxIn .45s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes boxIn { from { transform: scale(.6); } to { transform: scale(1); } }
  .m-title {
    font-size: clamp(30px, 9vw, 44px);
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: -1px;
  }
  .m-title.win {
    color: var(--red);
    text-shadow: 3px 3px 0 var(--yellow), 5px 5px 0 var(--ink);
    animation: titleWiggle .6s ease infinite alternate;
  }
  @keyframes titleWiggle { from { transform: rotate(-3deg) scale(1); } to { transform: rotate(3deg) scale(1.06); } }
  .m-title.lose { color: #555; }
  .m-label {
    margin-top: 14px;
    font-weight: 900;
    font-size: 17px;
    color: #fff;
    background: var(--red);
    display: inline-block;
    padding: 4px 14px;
    border-radius: 8px;
  }
  .m-gift { font-size: 72px; margin-top: 8px; display: inline-block; }
  .m-gift.shaking { animation: giftShake .12s infinite; }
  @keyframes giftShake {
    0% { transform: rotate(-8deg) scale(1); }
    50% { transform: rotate(8deg) scale(1.08); }
    100% { transform: rotate(-8deg) scale(1); }
  }
  .m-msg {
    margin-top: 12px;
    font-size: clamp(18px, 5vw, 22px);
    font-weight: 800;
    line-height: 1.45;
    word-break: keep-all;
    background: var(--yellow-light);
    border: 3px dashed var(--orange);
    border-radius: 14px;
    padding: 14px 12px;
  }
  .m-msg.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  .m-pay {
    margin-top: 10px;
    font-weight: 800;
    font-size: 16px;
  }
  .m-pay b {
    display: inline-block;
    min-width: 7em;
    color: var(--red);
    font-size: 22px;
    font-variant-numeric: tabular-nums;
  }
  .m-pay b.thud { animation: bump .5s ease; }
  .m-extra {
    margin-top: 10px;
    font-size: 15px;
    font-weight: 700;
    color: #7a3b00;
    word-break: keep-all;
  }
  .m-btns { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .m-btns button {
    font-family: inherit;
    font-size: 17px;
    font-weight: 900;
    border: 3px solid var(--ink);
    border-radius: 999px;
    padding: 10px 20px;
    box-shadow: 0 4px 0 var(--ink);
    cursor: pointer;
    background: #fff;
    color: var(--ink);
  }
  .m-btns button.primary { background: var(--red); color: #fff; }
  .m-btns button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  [hidden] { display: none !important; }

  @media (max-width: 380px) {
    .grid { gap: 7px; padding: 7px; }
    .ticket-inner { padding: 10px 8px 8px; }
  }
</style>
</head>
<body>

  <!-- 상단 카운터 -->
  <header class="top">
    <h1>💸 쓸데없는 즉석복권 💸</h1>
    <div class="stats">
      <div class="stat"><span class="label">누적 당첨금</span><span class="val" id="statPrize">0원</span></div>
      <div class="stat"><span class="label">1등 당첨 횟수</span><span class="val" id="statWins">0회</span></div>
      <div class="stat"><span class="label">긁은 복권 수</span><span class="val" id="statTickets">0장</span></div>
    </div>
    <button class="mute" id="muteBtn" aria-label="소리 켜기/끄기">🔊</button>
  </header>

  <main>
    <div class="hint" id="hint">은색 부분을 손가락이나 마우스로 긁어보세요!</div>

    <!-- 복권 카드 -->
    <section class="ticket" id="ticket">
      <div class="ticket-inner">
        <div class="ticket-head">
          <div class="badge">즉석</div>
          <h2>행운의 즉석복권</h2>
          <p class="sub">같은 그림 <b>3개</b>가 나오면 <b>1등!</b></p>
          <div class="jackpot">1등 당첨금 <strong>0원</strong></div>
        </div>
        <div class="grid" id="grid"></div>
        <div class="ticket-foot">
          <span>제 <b id="serial">0000</b>회</span>
          <span>No. <span id="code">000-0000</span></span>
        </div>
        <p class="fine">※ 본 복권의 당첨금은 법적으로나 도의적으로나 지급되지 않습니다.</p>
      </div>
    </section>

    <button class="big-btn" id="newBtn">🎟️ 새 복권 긁기</button>
  </main>

  <!-- 긴장 연출용 어두운 테두리 -->
  <div class="vignette"></div>

  <!-- 결과 팝업 -->
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="m-title" id="mTitle"></div>
      <div class="m-label" id="mLabel" hidden></div>
      <div><div class="m-gift" id="mGift" hidden>🎁</div></div>
      <div class="m-msg" id="mMsg" hidden></div>
      <div class="m-pay" id="mPay" hidden>실제 지급액: <b id="mPayVal">0원</b></div>
      <div class="m-extra" id="mExtra" hidden></div>
      <div class="m-btns" id="mBtns" hidden>
        <button id="mOk">확인</button>
        <button id="mAgain" class="primary">한 장 더 긁기</button>
      </div>
    </div>
  </div>

  <!-- 폭죽 -->
  <canvas id="confetti"></canvas>

<script>
(() => {
  'use strict';

  // ===== 설정 및 문구 =====
  const SYMBOLS = ['💎', '🍀', '🐷', '⭐', '🍒', '7️⃣'];
  const WIN_MSGS = [
    '당첨금 0원이 귀하의 마음속 계좌로 입금되었습니다',
    '상품: 오늘 하루 별일 없이 지나감',
    '상품: 동네 비둘기 한 마리의 존중',
    '축하합니다! 오늘 운을 여기서 다 쓰셨습니다',
    '상품: 내일 알람 5분 연장권 (효력 없음)',
    '상품: 아무도 모르게 잘생겨짐 (본인도 모름)',
    '상품: 다음 복권도 긁을 수 있는 권리',
    '상품: 냉장고를 열었을 때 원하는 게 있을 확률 +1%',
    '1등 상금은 마음으로 전달되었습니다. 받으셨나요?'
  ];
  const LOSE_MSGS = [
    '아쉽네요! 꽝 상품을 드립니다: 1등 상품과 동일함',
    '꽝! 하지만 1등이랑 받는 건 똑같으니 사실상 1등입니다'
  ];
  const NEAR_MSG = '아깝다! 하나만 더 나왔으면 0원 받을 뻔했어요';
  const STORE_KEY = 'useless-lotto-v1';
  const CLEAR_RATIO = 0.6; // 60% 이상 긁히면 자동 공개

  // ===== DOM =====
  const $ = (id) => document.getElementById(id);
  const grid = $('grid'), ticketEl = $('ticket'), hintEl = $('hint'), newBtn = $('newBtn');
  const modal = $('modal'), mTitle = $('mTitle'), mLabel = $('mLabel'), mGift = $('mGift');
  const mMsg = $('mMsg'), mPay = $('mPay'), mPayVal = $('mPayVal'), mExtra = $('mExtra'), mBtns = $('mBtns');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // ===== 카운터 (localStorage 저장) =====
  const stats = { wins: 0, tickets: 0, muted: false };
  function loadStats() {
    try {
      const d = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
      if (d) {
        stats.wins = Number(d.wins) || 0;
        stats.tickets = Number(d.tickets) || 0;
        stats.muted = !!d.muted;
      }
    } catch (e) { /* 저장소 사용 불가 시 무시 */ }
  }
  function saveStats() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(stats)); } catch (e) { /* 무시 */ }
  }
  function renderStats(bumpKey) {
    $('statPrize').textContent = '0원'; // 누적 당첨금은 언제나 0원
    $('statWins').textContent = stats.wins.toLocaleString('ko-KR') + '회';
    $('statTickets').textContent = stats.tickets.toLocaleString('ko-KR') + '장';
    if (bumpKey) {
      const el = $(bumpKey);
      el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    }
  }

  // ===== 사운드 (Web Audio API, 파일 없이 합성) =====
  let ac = null, master = null, noiseBuf = null;
  function initAudio() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = stats.muted ? 0 : 0.8;
      master.connect(ac.destination);
      // 화이트 노이즈 버퍼 (긁는 소리, 드럼롤용)
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }

  // 단순 음 하나 재생
  function tone(freq, start, dur, type, vol, endFreq, dest) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, start);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g); g.connect(dest || master);
    o.start(start); o.stop(start + dur + 0.05);
    return o;
  }

  // 필터를 거친 노이즈 한 조각
  function noiseHit(start, dur, vol, freq, filterType) {
    const src = ac.createBufferSource();
    src.buffer = noiseBuf;
    const f = ac.createBiquadFilter();
    f.type = filterType || 'bandpass';
    f.frequency.value = freq;
    f.Q.value = 0.9;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(start, Math.random() * 0.5, dur + 0.05);
  }

  // 사각사각 긁는 소리 (짧게, 너무 자주 나지 않게 제한)
  let nextScratchAt = 0;
  function scratchSound() {
    if (!ac) return;
    const now = ac.currentTime;
    if (now < nextScratchAt) return;
    nextScratchAt = now + 0.045;
    noiseHit(now, 0.06 + Math.random() * 0.03, 0.22, 2500 + Math.random() * 3000);
  }

  // 칸이 열릴 때 '띵'
  function dingSound() {
    if (!ac) return;
    const t = ac.currentTime;
    tone(1320, t, 0.25, 'sine', 0.15);
    tone(1980, t + 0.05, 0.3, 'sine', 0.08);
  }

  // 심장 소리 "두근… 두근…"
  function heartbeat() {
    if (!ac) return;
    const t = ac.currentTime;
    tone(95, t, 0.18, 'sine', 0.9, 42);
    tone(85, t + 0.22, 0.2, 'sine', 0.6, 38);
  }

  // 당첨 팡파레
  function fanfareSound() {
    if (!ac) return;
    const t = ac.currentTime;
    [523, 659, 784, 1047].forEach((f, i) => {
      tone(f, t + i * 0.11, 0.18, 'square', 0.07);
      tone(f, t + i * 0.11, 0.2, 'triangle', 0.15);
    });
    [523, 659, 784, 1047].forEach((f) => tone(f, t + 0.5, 1.0, 'triangle', 0.12));
    tone(1568, t + 0.5, 1.0, 'square', 0.03);
  }

  // 상품 공개 드럼롤 + 심벌
  function drumrollSound(dur) {
    if (!ac) return;
    const t = ac.currentTime, n = Math.floor(dur / 0.05);
    for (let i = 0; i < n; i++) noiseHit(t + i * 0.05, 0.05, 0.08 + 0.25 * (i / n), 900, 'bandpass');
    noiseHit(t + dur, 0.9, 0.35, 6000, 'highpass');
    tone(784, t + dur, 0.5, 'triangle', 0.15);
    tone(1047, t + dur + 0.08, 0.6, 'triangle', 0.15);
  }

  // 아쉬운 효과음 (뿌- 뿌- 뿌- 뿌우우~)
  function sadSound() {
    if (!ac) return;
    const t = ac.currentTime;
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 1100;
    lp.connect(master);
    [392, 370, 349].forEach((f, i) => tone(f, t + i * 0.38, 0.34, 'sawtooth', 0.18, null, lp));
    const last = tone(330, t + 1.14, 1.1, 'sawtooth', 0.18, 300, lp);
    // 마지막 음에 떨림(비브라토)
    const lfo = ac.createOscillator(), lfoGain = ac.createGain();
    lfo.frequency.value = 6; lfoGain.gain.value = 8;
    lfo.connect(lfoGain); lfoGain.connect(last.frequency);
    lfo.start(t + 1.14); lfo.stop(t + 2.3);
  }

  // 음소거 버튼
  const muteBtn = $('muteBtn');
  function renderMute() { muteBtn.textContent = stats.muted ? '🔇' : '🔊'; }
  muteBtn.addEventListener('click', () => {
    stats.muted = !stats.muted;
    if (master) master.gain.value = stats.muted ? 0 : 0.8;
    renderMute(); saveStats();
  });

  // ===== 복권 결과 생성 =====
  // 1등 40% / 아깝게 꽝(2개 같음) 40% / 그냥 꽝 20%
  function makeSymbols() {
    const r = Math.random();
    const s = shuffle(SYMBOLS.slice());
    let arr;
    if (r < 0.4) arr = [s[0], s[0], s[0], s[1], s[2], s[3]];
    else if (r < 0.8) arr = [s[0], s[0], s[1], s[2], s[3], s[4]];
    else arr = s.slice(0, 6);
    return shuffle(arr);
  }
  function countSymbols(cells) {
    const cnt = {};
    cells.forEach((c) => { cnt[c.sym] = (cnt[c.sym] || 0) + 1; });
    return cnt;
  }

  // ===== 복권 상태 =====
  let state = { cells: [], done: false };
  let timers = [];
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function setHint(text) { hintEl.textContent = text; }

  // 새 복권 만들기
  function newTicket() {
    clearTimers();
    stopTension();
    hideModal();
    newBtn.classList.remove('nudge');
    grid.innerHTML = '';
    state = { cells: [], done: false };

    makeSymbols().forEach((sym) => {
      const el = document.createElement('div');
      el.className = 'cell';
      const sp = document.createElement('span');
      sp.className = 'sym';
      sp.textContent = sym;
      const cv = document.createElement('canvas');
      el.append(sp, cv);
      grid.append(el);
      state.cells.push({ el, sym, cv, ctx: cv.getContext('2d', { willReadFrequently: true }), revealed: false, w: 0, h: 0, rect: null });
    });

    // 회차, 일련번호
    $('serial').textContent = String(1000 + Math.floor(Math.random() * 9000));
    $('code').textContent = String(Math.floor(Math.random() * 900) + 100) + '-' + String(Math.floor(Math.random() * 9000) + 1000);

    // 카드 등장 애니메이션
    ticketEl.classList.remove('enter'); void ticketEl.offsetWidth; ticketEl.classList.add('enter');
    setHint('은색 부분을 손가락이나 마우스로 긁어보세요!');
    requestAnimationFrame(() => state.cells.forEach(sizeCell));
  }

  // 캔버스 크기 맞추고 은색 코팅 그리기 (transform 영향 없는 clientWidth 사용)
  function sizeCell(c) {
    if (c.revealed) return;
    const w = c.el.clientWidth, h = c.el.clientHeight;
    if (!w || (w === c.w && h === c.h)) return;
    c.w = w; c.h = h;
    c.cv.width = Math.round(w * dpr);
    c.cv.height = Math.round(h * dpr);
    drawCoating(c);
  }

  function drawCoating(c) {
    const ctx = c.ctx, w = c.cv.width, h = c.cv.height;
    ctx.globalCompositeOperation = 'source-over';
    // 은색 그라데이션
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#c9c9c9');
    g.addColorStop(0.28, '#f4f4f4');
    g.addColorStop(0.5, '#a9a9a9');
    g.addColorStop(0.72, '#e8e8e8');
    g.addColorStop(1, '#9d9d9d');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    // 반짝이는 은박 질감
    const dots = Math.floor((w * h) / 70);
    for (let i = 0; i < dots; i++) {
      ctx.fillStyle = Math.random() < 0.5 ? `rgba(255,255,255,${Math.random() * 0.6})` : `rgba(90,90,90,${Math.random() * 0.15})`;
      ctx.fillRect(Math.random() * w, Math.random() * h, dpr, dpr);
    }
    // "긁어주세요" 글씨
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(-0.18);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `900 ${Math.round(w * 0.16)}px -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,.7)';
    ctx.fillText('긁어주세요', 1.5 * dpr, 1.5 * dpr);
    ctx.fillStyle = '#6f6f6f';
    ctx.fillText('긁어주세요', 0, 0);
    ctx.font = `${Math.round(w * 0.14)}px sans-serif`;
    ctx.fillText('🪙', 0, -h * 0.25);
    ctx.restore();
  }

  // ===== 긁기 (포인터 이벤트로 마우스/터치 통합) =====
  let dragging = false, lastX = 0, lastY = 0, brush = 24, lastCheck = 0;
  const touched = new Set();

  function scratchSeg(x0, y0, x1, y1) {
    for (const c of state.cells) {
      if (c.revealed || !c.rect) continue;
      const r = c.rect, pad = brush;
      // 선분이 이 칸 근처를 지나지 않으면 건너뜀
      if (Math.max(x0, x1) < r.left - pad || Math.min(x0, x1) > r.right + pad ||
          Math.max(y0, y1) < r.top - pad || Math.min(y0, y1) > r.bottom + pad) continue;
      const s = c.cv.width / r.width, ctx = c.ctx;
      ctx.globalCompositeOperation = 'destination-out'; // 그린 부분을 지움
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = brush * s;
      ctx.beginPath();
      ctx.moveTo((x0 - r.left) * s, (y0 - r.top) * s);
      ctx.lineTo((x1 - r.left) * s + 0.01, (y1 - r.top) * s);
      ctx.stroke();
      touched.add(c);
    }
  }

  // 긁힌 비율 계산 (8픽셀마다 샘플링)
  function clearedRatio(c) {
    const w = c.cv.width, h = c.cv.height;
    if (!w || !h) return 0;
    const d = c.ctx.getImageData(0, 0, w, h).data;
    let clear = 0, total = 0;
    for (let i = 3; i < d.length; i += 32) {
      total++;
      if (d[i] < 128) clear++;
    }
    return clear / total;
  }

  function checkTouched() {
    touched.forEach((c) => {
      if (!c.revealed && clearedRatio(c) >= CLEAR_RATIO) reveal(c);
    });
    touched.clear();
  }

  grid.addEventListener('pointerdown', (e) => {
    initAudio();
    if (state.done) {
      setHint('이 복권은 다 긁었어요. 새 복권을 긁어보세요!');
      newBtn.classList.add('nudge');
      return;
    }
    e.preventDefault();
    dragging = true;
    try { grid.setPointerCapture(e.pointerId); } catch (err) { /* 무시 */ }
    // 칸 위치를 미리 계산
    state.cells.forEach((c) => { c.rect = c.cv.getBoundingClientRect(); });
    const first = state.cells[0].rect;
    brush = Math.max(18, first.width * 0.24);
    lastX = e.clientX; lastY = e.clientY;
    scratchSeg(lastX, lastY, lastX, lastY);
    scratchSound();
  });

  grid.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    (evs.length ? evs : [e]).forEach((ev) => {
      scratchSeg(lastX, lastY, ev.clientX, ev.clientY);
      lastX = ev.clientX; lastY = ev.clientY;
    });
    scratchSound();
    const now = performance.now();
    if (now - lastCheck > 120) { lastCheck = now; checkTouched(); }
  });

  function endDrag() {
    if (!dragging) return;
    dragging = false;
    checkTouched();
  }
  grid.addEventListener('pointerup', endDrag);
  grid.addEventListener('pointercancel', endDrag);
  grid.addEventListener('lostpointercapture', endDrag);
  // iOS 등에서 혹시 모를 스크롤 방지
  grid.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  grid.addEventListener('contextmenu', (e) => e.preventDefault());

  // 칸 하나 공개
  function reveal(c) {
    c.revealed = true;
    c.cv.classList.add('gone');
    c.el.classList.add('open');
    c.el.classList.remove('tense');
    dingSound();
    afterReveal();
  }

  function afterReveal() {
    const opened = state.cells.filter((c) => c.revealed);
    if (opened.length === 5) {
      const counts = Object.values(countSymbols(opened));
      const max = Math.max(...counts);
      const last = state.cells.find((c) => !c.revealed);
      if (max === 2) startTension(last);   // 2개 같음 → 두근두근
      else if (max >= 3) setHint('어…? 이거 혹시…?!');
      else setHint('마지막 한 칸 남았어요!');
    } else if (opened.length < 5) {
      const max = Math.max(...Object.values(countSymbols(opened)));
      if (max === 2) setHint('오…! 같은 그림이 2개!');
    }
    if (opened.length === 6 && !state.done) {
      state.done = true;
      stopTension();
      later(finish, 600);
    }
  }

  // ===== 긴장 연출 =====
  let heartTimer = null;
  function startTension(lastCell) {
    document.body.classList.add('tense');
    lastCell.el.classList.add('tense');
    setHint('마지막 한 칸… 두근… 두근…');
    heartbeat();
    heartTimer = setInterval(heartbeat, 900);
  }
  function stopTension() {
    document.body.classList.remove('tense');
    clearInterval(heartTimer);
    heartTimer = null;
    state.cells.forEach((c) => c.el.classList.remove('tense'));
  }

  // ===== 결과 판정 =====
  function finish() {
    const cnt = countSymbols(state.cells);
    let best = null, max = 0;
    Object.keys(cnt).forEach((k) => { if (cnt[k] > max) { max = cnt[k]; best = k; } });

    stats.tickets++;
    if (max >= 3) stats.wins++;
    saveStats();
    renderStats(max >= 3 ? 'statWins' : 'statTickets');

    // 칸 강조
    state.cells.forEach((c) => {
      if (max >= 2 && c.sym === best) c.el.classList.add(max >= 3 ? 'match' : 'near');
      else c.el.classList.add('dim');
    });

    newBtn.classList.add('nudge');
    if (max >= 3) {
      setHint('🎉 1등 당첨! (상금 0원) 🎉');
      showWin();
    } else {
      setHint(max === 2 ? '아깝다… 하나만 더…!' : '꽝! 그래도 받는 건 똑같아요');
      showLose(max === 2);
    }
  }

  // ===== 결과 팝업 =====
  function resetModal() {
    [mLabel, mGift, mMsg, mPay, mExtra, mBtns].forEach((el) => { el.hidden = true; });
    mGift.classList.remove('shaking');
    mGift.textContent = '🎁';
    mMsg.classList.remove('pop');
    mTitle.className = 'm-title';
  }
  function hideModal() { modal.classList.remove('show'); }

  function extraMsg(w) {
    if (w >= 10 && Math.random() < 0.5) return '복권 회사가 당신을 두려워하기 시작했습니다';
    if (w >= 5 && Math.random() < 0.5) return '이쯤 되면 운이 아니라 실력입니다 (상금은 여전히 0원)';
    return '';
  }

  function showWin() {
    resetModal();
    mTitle.textContent = '🎉 1등 당첨!!! 🎉';
    mTitle.classList.add('win');
    modal.classList.add('show');
    fanfareSound();
    celebrate();

    // 1.5초 뒤 상품 공개 연출
    later(() => {
      mLabel.textContent = '두구두구… 상품 공개!';
      mLabel.hidden = false;
      mGift.hidden = false;
      mGift.classList.add('shaking');
      drumrollSound(1.3);

      later(() => {
        mGift.classList.remove('shaking');
        mGift.textContent = '✨';
        mLabel.textContent = '🎁 상품 공개 🎁';
        mMsg.textContent = pick(WIN_MSGS);
        mMsg.hidden = false;
        mMsg.classList.add('pop');
        const extra = extraMsg(stats.wins);
        if (extra) { mExtra.textContent = extra; mExtra.hidden = false; }
        rollPayout();
        mBtns.hidden = false;
        burst(innerWidth / 2, innerHeight / 2, 80, -Math.PI / 2, Math.PI * 2, 12);
      }, 1300);
    }, 1500);
  }

  // 지급액이 막 올라가다가 결국 0원
  function rollPayout() {
    mPay.hidden = false;
    mPayVal.classList.remove('thud');
    const iv = setInterval(() => {
      mPayVal.textContent = Math.floor(Math.random() * 999999999).toLocaleString('ko-KR') + '원';
    }, 50);
    timers.push(iv);
    later(() => {
      clearInterval(iv);
      mPayVal.textContent = '0원';
      void mPayVal.offsetWidth;
      mPayVal.classList.add('thud');
    }, 1300);
  }

  function showLose(near) {
    resetModal();
    mTitle.textContent = near ? '😫 아깝다!' : '😢 꽝!';
    mTitle.classList.add('lose');
    mMsg.textContent = near && Math.random() < 0.6 ? NEAR_MSG : pick(LOSE_MSGS);
    mMsg.hidden = false;
    mMsg.classList.add('pop');
    mBtns.hidden = false;
    modal.classList.add('show');
    sadSound();
  }

  $('mOk').addEventListener('click', () => { clearTimers(); hideModal(); });
  $('mAgain').addEventListener('click', () => { initAudio(); newTicket(); });
  newBtn.addEventListener('click', () => { initAudio(); newTicket(); });

  // ===== 폭죽 (confetti) =====
  const cc = $('confetti'), cx = cc.getContext('2d');
  const COLORS = ['#ff3b3b', '#ffd400', '#22c55e', '#3b82f6', '#a855f7', '#ff8a00', '#ff5fa2', '#ffffff'];
  let parts = [], confRAF = 0;

  function sizeConfetti() {
    cc.width = Math.round(innerWidth * dpr);
    cc.height = Math.round(innerHeight * dpr);
  }

  function burst(x, y, n, angle, spread, speed) {
    for (let i = 0; i < n; i++) {
      const a = angle + (Math.random() - 0.5) * spread;
      const s = speed * (0.45 + Math.random() * 0.75);
      parts.push({
        x, y,
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        w: 6 + Math.random() * 6, h: 9 + Math.random() * 9,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
        tilt: Math.random() * 6.28,
        c: pick(COLORS), round: Math.random() < 0.3
      });
    }
    if (!confRAF) confRAF = requestAnimationFrame(confLoop);
  }

  function confLoop() {
    const W = innerWidth, H = innerHeight;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.vy += 0.28;
      p.vx *= 0.985; p.vy *= 0.985;
      p.x += p.vx; p.y += p.vy;
      p.rot += p.vr; p.tilt += 0.12;
      cx.save();
      cx.translate(p.x, p.y);
      cx.rotate(p.rot);
      cx.scale(1, Math.cos(p.tilt)); // 팔랑팔랑
      cx.fillStyle = p.c;
      if (p.round) { cx.beginPath(); cx.arc(0, 0, p.w / 2, 0, 6.28); cx.fill(); }
      else cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cx.restore();
    }
    parts = parts.filter((p) => p.y < H + 40 && p.x > -60 && p.x < W + 60);
    if (parts.length) confRAF = requestAnimationFrame(confLoop);
    else { confRAF = 0; cx.clearRect(0, 0, W, H); }
  }

  // 화면 가득 폭죽
  function celebrate() {
    const W = innerWidth, H = innerHeight;
    const power = Math.max(16, Math.min(26, H / 34));
    burst(0, H * 0.85, 140, -Math.PI / 3, 0.9, power);
    burst(W, H * 0.85, 140, -Math.PI * 2 / 3, 0.9, power);
    [350, 750, 1150].forEach((ms) => later(() => {
      for (let i = 0; i < 4; i++) burst(Math.random() * W, -10, 30, Math.PI / 2, 1.4, 5);
    }, ms));
  }

  // ===== 화면 크기 변경 대응 =====
  window.addEventListener('resize', () => {
    sizeConfetti();
    state.cells.forEach(sizeCell);
  });

  // ===== 시작 =====
  loadStats();
  renderStats();
  renderMute();
  sizeConfetti();
  newTicket();
})();
</script>
</body>
